version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

# Set this to true only when you trigger a pipeline through the CircleCI
# web UI/API and want to run the renewal job manually.
parameters:
  run_manual:
    type: boolean
    default: false

jobs:
  renew-katabump:
    docker:
      - image: cimg/python:3.12-browsers
    resource_class: medium
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout

      - browser-tools/install_chromedriver:
          timeout: 5m

      - run:
          name: Verify browser runtime
          command: |
            set -euo pipefail
            command -v google-chrome
            command -v chromedriver
            command -v xvfb-run
            google-chrome --version
            chromedriver --version

      - run:
          name: Install Python dependencies
          command: |
            set -euo pipefail
            python3 --version
            pip_install() {
              python3 -m pip install \
                --retries 2 \
                --timeout 30 \
                "$@"
            }

            if ! pip_install --upgrade pip; then
              pip_install --index-url https://pypi.tuna.tsinghua.edu.cn/simple --upgrade pip
            fi
            if ! pip_install seleniumbase requests; then
              pip_install --index-url https://pypi.tuna.tsinghua.edu.cn/simple seleniumbase requests
            fi

      - run:
          name: Sync upstream script
          command: |
            set -eu
            git remote add upstream https://github.com/eooce/katabump-renew 2>/dev/null || true
            if git fetch --depth=1 upstream main; then
              echo "Syncing app.py and README.md from upstream"
              git checkout upstream/main -- app.py README.md || \
                echo "Upstream core files were not available; using local files"
            else
              echo "Upstream fetch failed; continuing with local files"
            fi

      - run:
          name: Configure optional sing-box proxy
          command: |
            set -eu
            if [ -z "${NODE_LINK:-}" ]; then
              echo "NODE_LINK is not set; using direct connection"
              exit 0
            fi

            if bash <(curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
              https://main.ssss.nyc.mn/setup_proxy.sh); then
              # app.py reads these variables when it starts. BASH_ENV makes
              # them available to the following CircleCI step.
              {
                echo 'export IS_PROXY=true'
                echo 'export PROXY_SERVER=http://127.0.0.1:1081'
              } >> "$BASH_ENV"
              echo "Proxy setup completed"
            else
              echo "Proxy setup failed; continuing without forcing proxy mode"
            fi

      - run:
          name: Run Katabump renewal
          command: |
            set -eux
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              python app.py

workflows:
  renew:
    # Schedule Triggers use the scheduled_pipeline trigger source.
    # The api source covers the CircleCI web app's Trigger Pipeline button.
    when:
      or:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ api, << pipeline.trigger_source >> ]
        - << pipeline.parameters.run_manual >>
    jobs:
      - renew-katabump
