version: 2.1

# Set this to true only when you trigger a pipeline through the CircleCI
# web UI/API and want to run the renewal job manually.
parameters:
  run_manual:
    type: boolean
    default: false

jobs:
  renew-katabump:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout

      - run:
          name: Install system dependencies
          command: |
            set -eux
            sudo apt-get update
            sudo apt-get install -y \
              ca-certificates \
              fonts-noto-cjk \
              python3-venv \
              scrot \
              wget \
              x11-utils \
              xdotool \
              xvfb

            # CircleCI machine images normally include Chrome. Keep a fallback
            # so the job remains runnable if the selected image changes.
            if ! command -v google-chrome >/dev/null 2>&1; then
              wget -qO /tmp/google-chrome.deb \
                https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo apt-get install -y /tmp/google-chrome.deb
            fi

      - run:
          name: Create Python environment and install dependencies
          command: |
            set -eux
            python3 --version
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install seleniumbase requests
            .venv/bin/seleniumbase install chromedriver

      - run:
          name: Sync upstream script
          command: |
            set -eu
            git remote add upstream https://github.com/eooce/katabump-renew 2>/dev/null || true
            if git fetch --depth=1 upstream main; then
              echo "Syncing app.py and README.md from upstream"
              git checkout upstream/main -- app.py README.md || \
                echo "Upstream core files were not available; using local files"
            else
              echo "Upstream fetch failed; continuing with local files"
            fi

      - run:
          name: Configure optional sing-box proxy
          command: |
            set -eu
            if [ -z "${NODE_LINK:-}" ]; then
              echo "NODE_LINK is not set; using direct connection"
              exit 0
            fi

            if bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh); then
              # app.py reads these variables when it starts. BASH_ENV makes
              # them available to the following CircleCI step.
              {
                echo 'export IS_PROXY=true'
                echo 'export PROXY_SERVER=http://127.0.0.1:1081'
              } >> "$BASH_ENV"
              echo "Proxy setup completed"
            else
              echo "Proxy setup failed; continuing without forcing proxy mode"
            fi

      - run:
          name: Run Katabump renewal
          command: |
            set -eux
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              .venv/bin/python app.py

workflows:
  renew:
    # Schedule Triggers use the scheduled_pipeline trigger source.
    # The api source covers the CircleCI web app's Trigger Pipeline button.
    when:
      or:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ api, << pipeline.trigger_source >> ]
        - << pipeline.parameters.run_manual >>
    jobs:
      - renew-katabump
